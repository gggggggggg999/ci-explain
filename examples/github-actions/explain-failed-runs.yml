# Example: explain failed runs of another workflow in the job summary, using the ci-explain action.
#
# STATUS: partially verified. On 2026-10-17 this setup ran successfully in the author's own
# repository, triggered by a failed same-repository pull request run. Fork pull requests and
# other setups have NOT been tested; review it before relying on it.
#
# Read docs/GITHUB-ACTIONS.md before using it, especially the security notes.

name: Explain failed runs

on:
  workflow_run:
    # Replace with the exact name(s) of the workflow(s) you want to explain.
    workflows: ['CI']
    types: [completed]

# Least privilege: reading workflow runs and their logs is all this job needs.
permissions:
  actions: read

jobs:
  explain:
    # Only react to failures.
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA (the code of the ci-explain release you reviewed).
      # This action runs ci-explain itself. It does NOT check out or run the pull request's code.
      - uses: gggggggggg999/ci-explain@a56d8eec93d42db1ddf0b9278ca0378dcc04cbdf
        with:
          # Event values are passed as inputs; the action hands them to the script through env.
          run-id: ${{ github.event.workflow_run.id }}
