# Dogfooding: explains failed runs of this repository's CI using the ci-explain composite action,
# pinned to a reviewed commit. See docs/GITHUB-ACTIONS.md.

name: Explain failed runs

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  actions: read

jobs:
  explain:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: gggggggggg999/ci-explain@a56d8eec93d42db1ddf0b9278ca0378dcc04cbdf # main at the time of writing
        with:
          run-id: ${{ github.event.workflow_run.id }}
